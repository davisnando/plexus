[package]
name = "plexus-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rmcp = { workspace = true, features = ["server", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "auth", "transport-io", "reqwest"] }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
percent-encoding = "2"
tokio-util = "0.7"
futures = "0.3"
http = "1"
subtle = "2"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"